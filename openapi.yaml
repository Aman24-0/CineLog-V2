  /api/admin/2fa/status:
    get:
      tags: [Admin]
      summary: 2FA enrollment status
      description: |
        Returns whether the current admin has 2FA enabled, and if so,
        the timestamp of enrollment.
      security: [adminCookie: []]
      responses:
        '200':
          description: 2FA status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
                  enrolledAt: { type: string, format: date-time, nullable: true }

  /api/admin/2fa/enroll:
    post:
      tags: [Admin]
      summary: Enroll in 2FA
      description: |
        Generates a TOTP secret + QR code for the admin to scan with
        their authenticator app. The secret is stored encrypted; the
        QR code is returned for immediate display.
      security: [adminCookie: []]
      responses:
        '200':
          description: TOTP secret + QR code data URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  qrCode: { type: string, description: 'data:image/png;base64,...' }

  /api/admin/2fa/verify:
    post:
      tags: [Admin]
      summary: Verify a 2FA enrollment
      description: |
        Verifies a 6-digit PIN against the pending TOTP secret. On
        success, marks 2FA as enabled for the admin.
      security: [adminCookie: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string, description: '6-digit TOTP code' }
              required: [pin]
      responses:
        '200':
          $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/schemas/Error'

  /api/admin/2fa/disable:
    post:
      tags: [Admin]
      summary: Disable 2FA
      description: |
        Disables 2FA for the current admin. Requires the current PIN
        to be provided (re-verification).
      security: [adminCookie: []]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pin: { type: string }
              required: [pin]
      responses:
        '200':
          $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/schemas/Error'
